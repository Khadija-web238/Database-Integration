<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141a;
    --surface:#191c23;
    --surface-2:#1f232b;
    --border:#2a2e38;
    --text:#e7e7ea;
    --muted:#8b8fa0;
    --accent:#7c9cf0;
    --accent-dim:#4a5da8;
    --danger:#d16565;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding:40px 24px 80px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  svg{display:block;}

  /* header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--accent);
  }
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .subtitle{color:var(--muted);font-size:13px;margin-top:3px;}
  .stat{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
  }
  .stat .n{font-size:26px;font-weight:600;color:var(--accent);line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}

  /* layout */
  .grid{display:grid;grid-template-columns:280px 1fr;gap:20px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
  }
  .card h2{
    font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 16px;font-weight:600;
  }

  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);padding:10px 12px;border-radius:7px;font-size:14px;
    font-family:'Space Grotesk',sans-serif;
  }
  input:focus{outline:none;border-color:var(--accent);}

  button{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
    border:none;border-radius:7px;padding:10px 16px;cursor:pointer;
    transition:transform .1s ease, opacity .15s ease, background .15s ease, color .15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{
    width:100%;justify-content:center;margin-top:18px;
    background:var(--accent);color:#10131c;
  }
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{
    background:transparent;color:var(--muted);border:1px solid var(--border);
    padding:7px 10px;font-size:12.5px;
  }
  .btn-ghost:hover{color:var(--text);border-color:#454b5a;}
  .btn-danger{
    background:transparent;color:var(--danger);border:1px solid rgba(209,101,101,.35);
    padding:7px 10px;font-size:12.5px;
  }
  .btn-danger:hover{background:rgba(209,101,101,.12);}

  #formError{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

  /* table */
  .table-card{padding:0;overflow:hidden;}
  .table-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 20px;border-bottom:1px solid var(--border);
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;color:var(--muted);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:.06em;
    padding:10px 20px;border-bottom:1px solid var(--border);
  }
  td{padding:12px 20px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,0.015);}
  .id-chip{
    display:inline-block;background:var(--surface-2);border:1px solid var(--border);
    color:var(--accent);padding:2px 8px;border-radius:5px;font-size:11.5px;
    font-family:'JetBrains Mono',monospace;
  }
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* inspect drawer */
  .inspect{
    display:none;background:#0e1015;border-top:1px solid var(--border);
  }
  .inspect.open{display:table-row;}
  .inspect td{padding:0;}
  .inspect-inner{padding:14px 20px;}
  .inspect-label{
    font-size:10.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:8px;
  }
  .inspect pre{
    margin:0;font-family:'JetBrains Mono',monospace;
    font-size:12.5px;color:#a9c6a1;white-space:pre-wrap;line-height:1.6;
  }

  footer{
    text-align:center;color:var(--muted);font-size:11.5px;margin-top:32px;
  }
  footer code{
    color:var(--accent);font-family:'JetBrains Mono',monospace;background:var(--surface-2);
    padding:2px 6px;border-radius:4px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
          <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
          <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path>
        </svg>
      </div>
      <div>
        <h1>User Records</h1>
        <div class="subtitle">Add, edit and remove records stored in your database</div>
      </div>
    </div>
    <div class="stat">
      <div class="n" id="recordCount">0</div>
      <div class="l">total records</div>
    </div>
  </header>

  <div class="grid">

    <!-- Add record -->
    <div class="card">
      <h2>New Record</h2>
      <form id="userForm">
        <label for="name">Name</label>
        <input id="name" required />

        <label for="email">Email</label>
        <input id="email" type="email" required />

        <label for="age">Age</label>
        <input id="age" type="number" min="0" />

        <button type="submit" class="btn-primary" id="submitBtn">Save Record</button>
        <div id="formError"></div>
      </form>
    </div>

    <!-- Table -->
    <div class="card table-card">
      <div class="table-head">
        <h2 style="margin:0;">All Records</h2>
        <button class="btn-ghost" id="refreshBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Refresh
        </button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- rows injected here -->
        </tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none;">No records yet — add your first one on the left.</div>
    </div>

  </div>

  <footer>Backed by the same REST API you built — <code>GET / POST / PUT / DELETE</code> on <code>/users</code></footer>
</div>

<script>
const API = '/users';
const tbody = document.getElementById('tbody');
const emptyState = document.getElementById('emptyState');
const recordCount = document.getElementById('recordCount');
const form = document.getElementById('userForm');
const formError = document.getElementById('formError');
const submitBtn = document.getElementById('submitBtn');

let editingId = null;

const ICONS = {
  eye: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
  edit: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
  trash: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`
};

async function loadUsers(){
  const res = await fetch(API);
  const users = await res.json();
  renderRows(users);
  recordCount.textContent = users.length;
}

function renderRows(users){
  tbody.innerHTML = '';
  emptyState.style.display = users.length ? 'none' : 'block';

  users.forEach(u => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><span class="id-chip">#${u.id}</span></td>
      <td>${escapeHtml(u.name)}</td>
      <td>${escapeHtml(u.email)}</td>
      <td>${u.age ?? '—'}</td>
      <td>
        <div class="row-actions">
          <button class="btn-ghost" data-action="inspect" data-id="${u.id}">${ICONS.eye} View</button>
          <button class="btn-ghost" data-action="edit" data-id="${u.id}">${ICONS.edit} Edit</button>
          <button class="btn-danger" data-action="delete" data-id="${u.id}">${ICONS.trash} Delete</button>
        </div>
      </td>
    `;
    tbody.appendChild(row);

    // hidden drawer: the exact row as it sits in the database
    const inspectRow = document.createElement('tr');
    inspectRow.className = 'inspect';
    inspectRow.id = `inspect-${u.id}`;
    inspectRow.innerHTML = `
      <td colspan="5">
        <div class="inspect-inner">
          <div class="inspect-label">Stored record</div>
          <pre>${JSON.stringify(u, null, 2)}</pre>
        </div>
      </td>
    `;
    tbody.appendChild(inspectRow);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[s]));
}

tbody.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if(action === 'inspect'){
    document.getElementById(`inspect-${id}`).classList.toggle('open');
  }

  if(action === 'delete'){
    if(!confirm(`Delete record #${id}? This cannot be undone.`)) return;
    await fetch(`${API}/${id}`, { method:'DELETE' });
    loadUsers();
  }

  if(action === 'edit'){
    const res = await fetch(`${API}/${id}`);
    const u = await res.json();
    document.getElementById('name').value = u.name;
    document.getElementById('email').value = u.email;
    document.getElementById('age').value = u.age ?? '';
    editingId = id;
    submitBtn.textContent = `Update Record #${id}`;
    window.scrollTo({top:0, behavior:'smooth'});
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  formError.style.display = 'none';

  const payload = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    age: document.getElementById('age').value ? Number(document.getElementById('age').value) : null
  };

  const url = editingId ? `${API}/${editingId}` : API;
  const method = editingId ? 'PUT' : 'POST';

  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if(!res.ok){
    const err = await res.json().catch(() => ({error:'Something went wrong'}));
    formError.textContent = err.error || 'Could not save record.';
    formError.style.display = 'block';
    return;
  }

  form.reset();
  editingId = null;
  submitBtn.textContent = 'Save Record';
  loadUsers();
});

document.getElementById('refreshBtn').addEventListener('click', loadUsers);

loadUsers();
</script>
</body>
</html>
